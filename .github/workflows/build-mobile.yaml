name: Build Mobile App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a compilar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: read
  actions: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    if: inputs.platform == 'android' || inputs.platform == 'all'
    defaults:
      run:
        working-directory: ./mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Fix Kotlin version compatibility
        run: |
          # 1. Suprimir el check de versión de Kotlin del Compose Compiler
          echo "suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          echo "kotlinVersion=1.9.25" >> android/gradle.properties

          # 2. Forzar Kotlin 1.9.25 y Compose suppression en todos los subproyectos
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.9.25'
                      }
                  }
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      freeCompilerArgs += [
                          "-P",
                          "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                      ]
                  }
              }
          }
          EOF
          echo "=== android/gradle.properties ==="
          cat android/gradle.properties

      - name: Build APK (Release)
        working-directory: ./mobile-app/android
        run: ./gradlew assembleRelease -PkotlinVersion=1.9.25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parroquia-app-android
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk

  build-ios:
    runs-on: macos-14
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    defaults:
      run:
        working-directory: ./mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist
          else
            echo "Aviso: GOOGLE_SERVICE_INFO_PLIST no configurado, creando archivo dummy para prebuild"
            cat << 'EOF' > GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>dummy.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.dummy</string>
            <key>API_KEY</key>
            <string>AIzaSyDummy</string>
            <key>GCM_SENDER_ID</key>
            <string>168683254656</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.jbelborja.parro</string>
            <key>PROJECT_ID</key>
            <string>parro-f3594</string>
            <key>STORAGE_BUCKET</key>
            <string>parro-f3594.firebasestorage.app</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:168683254656:ios:dummy</string>
          </dict>
          </plist>
          EOF
          fi

      - name: Cache CocoaPods
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-cache-${{ hashFiles('mobile-app/package.json') }}
          restore-keys: pods-cache-

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios

      - name: Patch Podfile y instalar CocoaPods
        working-directory: ./mobile-app/ios
        run: |
          # Parchear Podfile con Python:
          # 1. Habilitar modular_headers para Firebase y Google (necesario para resolver @import FirebaseCore en FirebaseMessaging)
          # 2. En post_install: subir deployment target a 13.4 en todos los targets y bundles de recursos
          # 3. Permitir non-modular includes en framework modules y habilitar DEFINES_MODULE en pods de Firebase
          python3 << 'PYEOF'
          import re

          with open('Podfile', 'r') as f:
              content = f.read()

          # Fix 1: Habilitar modular_headers para pods de Firebase y Google dentro del target
          modular_pods = (
              "\n"
              "  # Modular headers para Firebase y Google (necesario para @import en FirebaseCoreInternal / FirebaseMessaging)\n"
              "  pod 'FirebaseCore', :modular_headers => true\n"
              "  pod 'FirebaseCoreInternal', :modular_headers => true\n"
              "  pod 'FirebaseInstallations', :modular_headers => true\n"
              "  pod 'FirebaseMessaging', :modular_headers => true\n"
              "  pod 'GoogleDataTransport', :modular_headers => true\n"
              "  pod 'GoogleUtilities', :modular_headers => true\n"
              "  pod 'PromisesObjC', :modular_headers => true\n"
              "  pod 'nanopb', :modular_headers => true\n"
          )
          content = re.sub(
              r"(^\s*target '[^']+' do\s*$)",
              r"\1" + modular_pods,
              content,
              count=1,
              flags=re.MULTILINE
          )

          # Fix 2: Deployment target 13.4, CLANG_ALLOW_NON_MODULAR_INCLUDES y DEFINES_MODULE en targets y bundles
          fix = (
              "\n"
              "    # Fix para compatibilidad Xcode 15.4 + Firebase + React Native\n"
              "    installer.pods_project.build_configurations.each do |config|\n"
              "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.4'\n"
              "    end\n"
              "    installer.pods_project.targets.each do |target|\n"
              "      target.build_configurations.each do |config|\n"
              "        config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.4'\n"
              "        config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\n"
              "        if target.name.start_with?('Firebase') || target.name.start_with?('Google') || ['nanopb', 'PromisesObjC'].include?(target.name)\n"
              "          config.build_settings['DEFINES_MODULE'] = 'YES'\n"
              "          config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'\n"
              "        end\n"
              "      end\n"
              "    end\n"
              "    if installer.respond_to?(:target_installation_results)\n"
              "      installer.target_installation_results.pod_target_installation_results.each do |_, res|\n"
              "        res.resource_bundle_targets.each do |rb_target|\n"
              "          rb_target.build_configurations.each do |config|\n"
              "            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.4'\n"
              "            config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\n"
              "          end\n"
              "        end\n"
              "      end\n"
              "    end\n"
          )
          content = re.sub(
              r'(^\s*post_install do \|installer\|)',
              r'\1' + fix,
              content,
              count=1,
              flags=re.MULTILINE
          )

          with open('Podfile', 'w') as f:
              f.write(content)

          print("Podfile parcheado con éxito")
          PYEOF

          echo "=== Verificando Podfile ==="
          grep -n "FirebaseCore\|GoogleUtilities\|IPHONEOS\|CLANG_ALLOW_NON_MODULAR\|DEFINES_MODULE" Podfile

          pod install --repo-update

      - name: Build iOS App (.app / .ipa)
        working-directory: ./mobile-app/ios
        run: |
          WORKSPACE_NAME=$(basename *.xcworkspace .xcworkspace)
          echo "Compilando workspace y scheme: $WORKSPACE_NAME"

          set -o pipefail
          xcodebuild \
            -workspace "${WORKSPACE_NAME}.xcworkspace" \
            -scheme "$WORKSPACE_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            IPHONEOS_DEPLOYMENT_TARGET=13.4 \
            build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD FAILED: ERRORES DETECTADOS ==="
              grep -E "(error:|fatal error:|\*\* BUILD FAILED \*\*)" xcodebuild.log | head -n 30 || tail -n 60 xcodebuild.log
              exit 65
            }

          # Empaquetar el .app resultante en un .ipa
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/${WORKSPACE_NAME}.app Payload/
          zip -r parroquia-app-ios.ipa Payload
          mv parroquia-app-ios.ipa ../parroquia-app-ios.ipa

      - name: Upload iOS App Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: parroquia-app-ios
          path: mobile-app/parroquia-app-ios.ipa

  prune-artifacts:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()
    steps:
      - name: Prune old artifacts (keep last 3 of each app)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for ARTIFACT_TYPE in "parroquia-app-android" "parroquia-app-ios"; do
            echo "Procesando artefactos para: $ARTIFACT_TYPE"
            # Listar artefactos ordenados de mas reciente a mas antiguo
            gh api "repos/$REPO/actions/artifacts?per_page=100" \
              --jq ".artifacts | [.[] | select(.name == \"$ARTIFACT_TYPE\")] | sort_by(.created_at) | reverse | .[3:][] | .id" > to_delete.txt || true

            while IFS= read -r id; do
              if [ -n "$id" ]; then
                echo "Eliminando artefacto antiguo ID: $id"
                gh api --method DELETE "repos/$REPO/actions/artifacts/$id" || true
              fi
            done < to_delete.txt
          done
