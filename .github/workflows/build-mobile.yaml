name: Build Mobile App

on:
  push:
    branches:
      - apps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Fix Kotlin version compatibility
        run: |
          # 1. Suprimir el check de versión de Kotlin del Compose Compiler
          echo "suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          echo "kotlinVersion=1.9.25" >> android/gradle.properties

          # 2. Forzar Kotlin 1.9.25 y Compose suppression en todos los subproyectos
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.9.25'
                      }
                  }
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      freeCompilerArgs += [
                          "-P",
                          "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                      ]
                  }
              }
          }
          EOF
          echo "=== android/gradle.properties ==="
          cat android/gradle.properties

      - name: Build APK (Release)
        working-directory: ./mobile-app/android
        run: ./gradlew assembleRelease -PkotlinVersion=1.9.25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parroquia-app-android
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk

