{{ define "main" }}
{{ $sidebarHtml := trim (partial "sidebar.html" .) " \n\r\t" }}
<div class="{{ if $sidebarHtml }}layout-with-sidebar{{ else }}content-wrapper{{ end }}">
    <div class="content-wrapper main-column" {{ if not $sidebarHtml }}style="max-width: 100% !important; width: 100% !important; flex: none;"{{ end }}>
        <h1>{{ .Title }}</h1>
        
        {{ if not .Date.IsZero }}
        <div class="post-meta" style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 20px;">
            Publicado el: {{ .Date.Format "02-01-2006" }}
        </div>
        {{ end }}
        
        <div class="page-content" style="margin-top: 20px; line-height: 1.8;">
            {{ .Content }}
        </div>
    </div>

    {{ if $sidebarHtml }}
    {{ $sidebarHtml | safeHTML }}
    {{ end }}
</div>
{{ end }}
